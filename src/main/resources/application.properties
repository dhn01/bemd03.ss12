spring.application.name=medical

# Cấu hình kết nối đến database
spring.datasource.url=jdbc:postgresql://localhost:5432/db_hospital
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver
# Cấu hình JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Cấu hình log
logging.file.name=logs/medical_logs.log
logging.file.path=logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] [%thread] %-5level %logger{36} - %msg%n
logging.pattern.level=%5p
# thông số giới hạn dung lượng của 1 file
logging.logback.rollingpolicy.max-file-size=10MB
# giới hạn file tồn tại trong bao lâu
logging.logback.rollingpolicy.max-history=7
logging.level.root=info
logging.level.sql=debug
logging.level.com.example.hospital.models.services.impl=trace

spring.jackson.deserialization.fail-on-unknown-properties=true